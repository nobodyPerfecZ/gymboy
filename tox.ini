[tox]
isolated_build = true
envlist = py310
skipsdist = true

[testenv]
description = Run tests, linters, type checks, dependency checks, and security scans
allowlist_externals = uv
setenv =
    UV_NO_PROGRESS = 1
commands =
    # Install all dependencies
    uv sync --active --group dev

    # Code formatting
    uv run --active ruff check --fix gymboy tests
    uv run --active ruff format gymboy tests

    # Markdown linting
    uv run --active rumdl check --fix README.md

    # Type checking
    uv run --active ty check gymboy tests

    # Dependency checks
    uv run --active deptry gymboy tests

    # Security linting
    uv run --active bandit -r gymboy tests -ll -f custom

    # Run tests
    uv run --active pytest tests