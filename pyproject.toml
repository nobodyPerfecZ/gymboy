[project]
name = "gymboy"
version = "0.0.1"
description = "Gameboy (Color) environments in Gymnasium 🤖"
authors = [{ name = "Dennis Jabs" }]
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = ["gymnasium>=1.1.1", "pyboy>=2.5.3", "scikit-image>=0.25.2"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.1",
]

[project.urls]
Homepage = "https://github.com/nobodyPerfecZ/gymboy"
Issues = "https://github.com/nobodyPerfecZ/gymboy/issues"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 88
lint.ignore = ["E203"]
target-version = "py310"
lint.select = ["E", "F", "B", "I"]
lint.mccabe.max-complexity = 10
